name: Thor Browser macOS builds

on:
  push:
    branches: ['thor-browser-release-v*']
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA from a successful build on this release branch
        required: true
        type: string
      notes:
        description: Release notes in Markdown
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: thor-browser-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    if: github.event_name == 'push' && !github.event.deleted
    name: Thor Browser macOS arm64 / ${{ matrix.preset }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: ThorVG
            engines: cpu
            build_dir: Build/thorvg
          - preset: ThorVGGL
            engines: cpu,gl
            build_dir: Build/thorvg-gl
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.4'
      BUILD_DIR: ${{ matrix.build_dir }}
      PRESET: ${{ matrix.preset }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          os: macOS
          arch: arm64
          toolchain: Clang
          build_preset: ${{ matrix.preset }}
          xcode_version: '26'

      - name: Check out ThorVG
        uses: actions/checkout@v7.0.1
        with:
          repository: thorvg/thorvg
          ref: a20bfdf6ad804ada6ed5ac4a4237d2b431757952
          path: Build/thorvg-src
          persist-credentials: false

      - name: Build ThorVG
        env:
          ENGINES: ${{ matrix.engines }}
        run: |
          brew install meson
          prefix="$RUNNER_TEMP/thorvg"
          # Keep ThorVG's GL dispatch symbols separate from the system GL calls in the compositor.
          meson setup "$RUNNER_TEMP/thorvg-build" Build/thorvg-src --prefix="$prefix" --libdir=lib \
            --buildtype=release --default-library=shared -Dengines="$ENGINES" -Dloaders= -Dextra=
          meson install -C "$RUNNER_TEMP/thorvg-build"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: Build/caches/vcpkg-binary-cache
          key: thorvg-vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg*.json', 'Meta/CMake/vcpkg/**') }}

      - name: Build browser and renderer tests
        run: |
          jobs=$(sysctl -n hw.ncpu)
          python3 Meta/ladybird.py build --preset "$PRESET" -j "$jobs" Ladybird
          targets=(WebDriver TestThorVGPainter)
          if [[ "$PRESET" == ThorVGGL ]]; then targets+=(TestThorVGGL); fi
          cmake --build "$BUILD_DIR" --parallel "$jobs" --target "${targets[@]}"

      - name: Run renderer tests
        run: |
          ctest --test-dir "$BUILD_DIR" --output-on-failure --no-tests=error -R '^TestThorVGPainter$'
          if [[ "$PRESET" == ThorVGGL ]]; then
            ctest --test-dir "$BUILD_DIR" --output-on-failure --no-tests=error -R '^TestThorVGGL$'
          fi

      - name: Package the browser
        run: |
          cmp Build/thorvg-src/LICENSE Meta/Licenses/ThorVG.txt
          VCPKG_ROOT="$PWD/Build/vcpkg-release" cmake --build "$BUILD_DIR" --target third_party_sources
          cmake --install "$BUILD_DIR" --strip --component ladybird_Runtime --prefix "$RUNNER_TEMP/install"
          python3 Meta/package-macos-test-bundle.py --build-dir "$BUILD_DIR" \
            --extra-dylib "$RUNNER_TEMP/thorvg/lib/libthorvg-1.dylib" \
            --install-dir "$RUNNER_TEMP/install" --output "Thor-Browser-macOS-arm64-$PRESET.dmg"

      - uses: actions/upload-artifact@v7
        with:
          path: Thor-Browser-macOS-arm64-${{ matrix.preset }}.dmg
          archive: false
          overwrite: true
          if-no-files-found: error

  test-release-images:
    name: Test Thor Browser disk images on macOS 15
    needs: build
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Thor-Browser-macOS-arm64-*.dmg
          path: images
          merge-multiple: true
          skip-decompress: true

      - name: Launch the packaged browsers
        run: |
          mount="$RUNNER_TEMP/mounted"
          mkdir "$mount"
          for preset in ThorVG ThorVGGL; do
            hdiutil attach -readonly -nobrowse -mountpoint "$mount" "images/Thor-Browser-macOS-arm64-$preset.dmg"
            app="Thor Browser"
            bundle_id="sh.karthikeyan.thor-browser"
            if [[ "$preset" == ThorVGGL ]]; then
              app="Thor Browser GL"
              bundle_id="$bundle_id.gl"
            fi
            tar -tf "$mount/Sources/third-party-sources.tar" > "$RUNNER_TEMP/lgpl-ports.txt"
            grep -q '^qtbase-' "$RUNNER_TEMP/lgpl-ports.txt"
            grep -q '^ffmpeg-' "$RUNNER_TEMP/lgpl-ports.txt"
            test -s "$mount/Sources/README.txt"
            contents="$mount/$app.app/Contents"
            test "$(plutil -extract CFBundleIdentifier raw "$contents/Info.plist")" = "$bundle_id"
            test "$(plutil -extract CFBundleDisplayName raw "$contents/Info.plist")" = "$app"
            test "$(readlink "$mount/Applications")" = /Applications
            codesign --verify --deep --strict "$mount/$app.app"
            "$mount/$app.app/Contents/MacOS/Ladybird" --headless=text --temporary-profile --renderer=thorvg \
              'data:text/html,<p>thorvg-release-smoke</p>' > "$RUNNER_TEMP/page.txt"
            grep -F 'thorvg-release-smoke' "$RUNNER_TEMP/page.txt"
            hdiutil detach "$mount"
            mkdir -p "$mount"
          done

  release:
    name: Publish Thor Browser release
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/thor-browser-release-v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TESTED_COMMIT: ${{ inputs.commit }}
      RELEASE_NOTES: ${{ inputs.notes }}
    steps:
      - name: Find the tested release build
        id: build
        run: |
          [[ "$TESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          run_id=$(gh run list --workflow thorvg.yml --event push --branch "$GITHUB_REF_NAME" \
            --commit "$TESTED_COMMIT" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful push build of $TESTED_COMMIT on $GITHUB_REF_NAME."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.build.outputs.run_id }}
          pattern: Thor-Browser-macOS-arm64-*.dmg
          path: images
          merge-multiple: true
          skip-decompress: true

      - name: Publish both disk images
        working-directory: images
        run: |
          images=(Thor-Browser-macOS-arm64-ThorVG.dmg Thor-Browser-macOS-arm64-ThorVGGL.dmg)
          for image in "${images[@]}"; do test -s "$image"; done
          sha256sum "${images[@]}" > SHA256SUMS

          tag="thor-browser-${GITHUB_REF_NAME#thor-browser-release-}"
          if ! gh api "repos/$GH_REPO/git/ref/tags/$tag" --silent 2>/dev/null; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$TESTED_COMMIT" --silent
          fi
          remote_commit=$(gh api "repos/$GH_REPO/commits/refs/tags/$tag" --jq '.sha')
          if [[ "$remote_commit" != "$TESTED_COMMIT" ]]; then
            echo "::error::The tag no longer points to the tested commit."
            exit 1
          fi
          if draft=$(gh release view "$tag" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" == false ]]; then
              echo "Release $tag was already published."
              exit 0
            fi
          else
            printf '%s\n' "$RELEASE_NOTES" | gh release create "$tag" --draft --verify-tag --title "Thor Browser ${tag#thor-browser-v}" --notes-file -
          fi
          gh release upload "$tag" "${images[@]}" SHA256SUMS --clobber
          printf '%s\n' "$RELEASE_NOTES" | gh release edit "$tag" --draft=false --verify-tag --notes-file -
